default_language_version:
  python: python3.12
# Every stage but commit-msg, where a file hook would run against the message.
default_stages: [pre-commit, pre-push, manual]
repos:
  - repo: https://github.com/Lucas-C/pre-commit-hooks-nodejs
    rev: v1.1.2
    hooks:
      - id: dockerfile_lint
  - repo: https://github.com/python-poetry/poetry
    rev: 2.1.3
    hooks:
      - id: poetry-check
      - id: poetry-lock
  # The hooks below used to be `language: system`, which works only inside
  # the project's Poetry environment. pre-commit now installs each tool
  # itself, at the version poetry.lock pins for the dev group, so a plain
  # `git commit` runs them too.
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: f71fa2c1f9cf5cb705f73dffe4b21f7c61470ba9 # frozen: v4.4.0
    hooks:
      - id: check-toml
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace
  - repo: https://github.com/PyCQA/bandit
    rev: ca4faf2f82a7c68a088100f8ba2b8e56f9bdcfe3 # frozen: 1.7.5
    hooks:
      - id: bandit
        args: ["-c", "bandit.yml"]
        # bandit 1.7.5 imports pbr at run time; this is poetry.lock's version.
        additional_dependencies: ["pbr==5.11.1"]
  - repo: https://github.com/psf/black-pre-commit-mirror
    rev: 4f9accde9875c9559acf6d12a3eefeee0fd722f1 # frozen: 23.7.0
    hooks:
      - id: black
  - repo: https://github.com/PyCQA/isort
    rev: e44834b7b294701f596c9118d6c370f86671a50d # frozen: 5.12.0
    hooks:
      - id: isort
        args: ["--filter-files"]
  - repo: https://github.com/asottile/pyupgrade
    rev: 6dbfc2a52965415ed3dbd81d6b9e87e643a5f626 # frozen: v2.38.4
    hooks:
      - id: pyupgrade
        args: [--py37-plus]
  - repo: local
    hooks:
      # Manual only, from the project's environment (`poetry run`).
      - id: darglint
        name: darglint
        entry: darglint
        language: system
        types: [python]
        stages: [manual]
  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v2.6.0
    hooks:
      - id: prettier
  # A TODO or FIXME names its GitHub issue, as TODO(#123). Markdown and this
  # file use the words without being sentinels.
  - repo: local
    hooks:
      - id: todo-needs-issue
        name: TODO and FIXME name an issue, as TODO(#N)
        language: pygrep
        # Code only: never the commit message, which may name the words.
        stages: [pre-commit]
        entry: '\b(TODO|FIXME)\b(?!\(#\d+\))'
        exclude_types: [markdown]
        exclude: '^\.pre-commit-config\.yaml$'
