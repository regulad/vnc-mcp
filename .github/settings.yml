# Repository configuration, managed by the Settings app
# (https://github.com/repository-settings/app). The shared defaults come from
# regulad/.github; this file sets only what is this repository's own.
_extends: .github

repository:
  name: "vnc-mcp"
  description: >-
    🤖🖥 vnc-mcp allows MCP-compatible LLMs to interact with any desktop accessible over VNC
  homepage: "https://vnc-mcp.readthedocs.io/"
  private: false
  # Topics: comma-and-space separated string, NOT a YAML list.
  topics: python, vnc, mcp, llm, ai, machine-learning, desktop-automation, automation
  default_branch: master

  has_projects: true
  has_wiki: true

labels:
  # Release Drafter's categories (.github/release-drafter.yml).
  - name: breaking
    color: "bfd4f2"
    description: Breaking Changes
  - name: removal
    color: "9ae7ea"
    description: Removals and Deprecations
  - name: performance
    color: "016175"
    description: Performance
  - name: testing
    color: "b1fc6f"
    description: Testing
  - name: refactoring
    color: "ef67c4"
    description: Refactoring
  - name: style
    color: "c120e5"
    description: Style
  # Dependabot's, one for each ecosystem it updates.
  - name: python
    color: "2b67c6"
    description: Pull requests that update Python code
  - name: docker
    color: "21ceff"
    description: Pull requests that update docker code
  - name: github_actions
    color: "000000"
    description: Pull requests that update Github_actions code

branches:
  - name: main
    # https://docs.github.com/en/rest/reference/repos#update-branch-protection
    # Branch Protection settings. Set to null to disable
    protection:
      # Required. Require at least one approving review on a pull request, before merging. Set to null to disable.
      required_pull_request_reviews:
        # The number of approvals required. (1-6)
        required_approving_review_count: 1
        # Dismiss approved reviews automatically when a new commit is pushed.
        dismiss_stale_reviews: true
        # Blocks merge until code owners have reviewed.
        require_code_owner_reviews: true
        # Specify which users and teams can dismiss pull request reviews. Pass an empty dismissal_restrictions object to disable. User and team dismissal_restrictions are only available for organization-owned repositories. Omit this parameter for personal repositories.
        dismissal_restrictions:
          users: []
          teams: []
      # Required. Require status checks to pass before merging. Set to null to disable
      required_status_checks:
        # Required. Require branches to be up to date before merging.
        strict: true
        # Required. The list of status checks to require in order to merge into this branch
        contexts: []
      # Required. Enforce all configured restrictions for administrators. Set to true to enforce required status checks for repository administrators. Set to null to disable.
      enforce_admins: true
      # Prevent merge commits from being pushed to matching branches
      required_linear_history: true
      # Required. Restrict who can push to this branch. Team and user restrictions are only available for organization-owned repositories. Set to null to disable.
      restrictions:
        apps: []
        users: []
        teams: []
